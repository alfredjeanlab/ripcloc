[workspace]
resolver = "2"
members = ["crates/cli"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
