[package]
name = "ripcloc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Counts lines of code by language, split into source and tests"
readme = "../../README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
memchr = "2"
regex = "1"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
yare = "3"

[[test]]
name = "cli"
path = "../../tests/cli.rs"

[lints]
workspace = true
