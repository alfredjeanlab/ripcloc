[package]
name = "ripcloc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Counts lines of code very fast"
readme = "../../README.md"
repository = "https://github.com/alfredjeanlab/ripcloc"
keywords = ["cloc", "sloc", "lines-of-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
globset = "0.4"
ignore = "0.4"
lexopt = "0.3"
memchr = "2"
serde_core = "1"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3"
yare = "3"

[lints]
workspace = true

[[bench]]
name = "count"
harness = false
